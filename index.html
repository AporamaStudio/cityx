<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cityx09 · 守住火光</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand">CITYX<span>09</span><small>防守实验 / 01</small></div><div class="tag">建设你的防线，守住最后的火光。</div><span id="phase" class="badge">准备布防</span></header>
<main><section class="arena"><div class="mapbar"><div><strong>灰烬街区</strong><span>30 × 30 · 固定地形</span></div><div class="viewtools"><label><input id="routes" type="checkbox" checked>路线</label><label><input id="heat" type="checkbox" checked>火力</label><button id="out" aria-label="缩小">−</button><button id="in" aria-label="放大">＋</button><button id="fit">全图</button></div></div><div id="viewport"><canvas id="map" aria-label="30乘30防守棋盘，单击布置武器，拖动平移地图"></canvas><div class="maplegend"><span class="teal">■ 火力覆盖</span><span class="orange">◆ 篝火</span><span class="red">■ 来袭敌群</span><span>▧ 不可通行</span></div></div><footer><span id="cellInfo">悬停查看格子 · 单击建造 · 拖动平移 · 滚轮缩放</span><span id="zoom">100%</span></footer></section>
<aside><section class="panel"><div class="eyebrow">守护目标</div><div class="camp-title"><h1>守住火光</h1><strong id="campHP">30 / 30</strong></div><div class="meter"><i id="campBar"></i></div><div class="stats"><div><small>可用预算</small><b id="budget">100</b></div><div><small>逻辑节拍</small><b id="tick">0</b></div><div><small>已出批次</small><b id="spawned">0 / 12</b></div></div></section>
<section class="panel"><div class="eyebrow">布防工具</div><div class="toolrow"><button id="build" class="selected">＋ 武器 A</button><button id="erase">拆除 / 退款</button></div><p class="muted">10 预算 · 范围 1 · 火力 2<br>覆盖自身与相邻四格，可叠加。不阻挡敌人。</p><div id="notice" role="status">先看来袭路线，再选择武器位置。</div></section>
<section class="panel controls"><button id="start" class="primary" disabled>开始防守</button><div class="toolrow"><button id="pause" disabled>暂停</button><button id="step" disabled>前进一步</button><select id="speed" aria-label="播放速度"><option value="1">1× 速度</option><option value="2">2× 速度</option><option value="4">4× 速度</option></select></div><div class="toolrow"><button id="retry">保留布局重试</button><button id="clear">清空重来</button></div><p id="result" class="muted">调整布局后，开始一波防守。</p></section>
<section class="panel"><details id="settings"><summary>来袭配置 <span>可增删源头</span></summary><p class="muted">坐标 0–29；首拍和间隔按统一节拍计算。修改后点击应用。</p><div id="sources"></div><div class="toolrow"><button id="addSource">＋ 源头</button><button id="apply">应用配置</button></div><p id="configError" role="alert"></p></details></section>
<section class="panel"><div class="eyebrow">战场记录</div><ol id="log"><li>等待第一波敌人。</li></ol></section>
</aside></main><script type="module" src="src/app.js"></script></body></html>
